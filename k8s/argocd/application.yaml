apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eks-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  source:
    repoURL: git@github.com:Aosman4395/EKS-Project.git
    targetRevision: main
    path: app

  destination:
    server: https://kubernetes.default.svc
    namespace: eks-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true