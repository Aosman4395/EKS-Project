apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 84.5.0
    helm:
      values: |
        crds:
          enabled: false

        grafana:
          enabled: true
          adminPassword: admin123

          service:
            type: ClusterIP

          ingress:
            enabled: true
            ingressClassName: nginx
            hosts:
              - grafana.ahmedo.co.uk
            path: /
            pathType: Prefix
            annotations:
              kubernetes.io/ingress.class: nginx
              cert-manager.io/cluster-issuer: letsencrypt-prod
              external-dns.alpha.kubernetes.io/hostname: grafana.ahmedo.co.uk
            tls:
              - secretName: grafana-tls
                hosts:
                  - grafana.ahmedo.co.uk

        prometheus:
          enabled: true
          prometheusSpec:
            retention: 7d
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false

        alertmanager:
          enabled: true

        nodeExporter:
          enabled: false

        prometheus-node-exporter:
          enabled: false

        kubeStateMetrics:
          enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true