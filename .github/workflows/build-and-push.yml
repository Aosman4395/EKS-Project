name: App Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'app/**'
      - 'infra/**'
      - '.github/workflows/**'

concurrency:
  group: app-deployment-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: memos
  IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::409987738946:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6

      - name: Build, scan and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build --no-cache -f Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          trivy image --severity HIGH,CRITICAL --exit-code 1 \
          --ignorefile .trivyignore \$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG          
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  terraform-plan:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::409987738946:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        run: |
          checkov -d . --framework terraform \
            --skip-check CKV_AWS_274,CKV_AWS_91,CKV_AWS_150,CKV2_AWS_28,CKV2_AWS_11,CKV_AWS_136,CKV_AWS_18,CKV_AWS_144,CKV2_AWS_61,CKV2_AWS_62,CKV2_AWS_5,CKV_AWS_58,CKV_AWS_38,CKV_AWS_39,CKV_AWS_382,CKV_AWS_260

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: ./infra/main
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ./infra/main
        run: terraform init

      - name: Terraform Validate
        working-directory: ./infra/main
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./infra/main
        run: terraform plan -out=tfplan -var="image_tag=${{ env.IMAGE_TAG }}" -lock-timeout=5m

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ./infra/main/tfplan

  terraform-apply:
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::409987738946:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./infra/main
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v8.0.1
        with:
          name: terraform-plan
          path: ./infra/main

      - name: Terraform Apply
        working-directory: ./infra/main
        run: terraform apply -auto-approve -lock-timeout=5m tfplan

  verify-deploy:
    runs-on: ubuntu-latest
    needs: terraform-apply

    steps:
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::409987738946:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name memos-eks-cluster

      - name: Verify deployment
        run: |
          aws eks wait cluster-active --name memos-eks-cluster --region $AWS_REGION
          kubectl get nodes
          curl --fail https://eks.ahmedo.co.uk
